<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Watch Party Sync 🎬</title>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121214;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    h1 {
      color: #9146FF;
      margin-bottom: 20px;
    }

    #lobby-card {
      background-color: #202024;
      border: 1px solid #29292e;
      border-radius: 8px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .tab-buttons {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #29292e;
      padding-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      background-color: transparent;
      color: #a8a8b3;
      border: none;
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
    }

    .tab-btn.active {
      background-color: #29292e;
      color: #9146FF;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #29292e;
      background-color: #121214;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: #9146FF;
    }

    button.primary-btn {
      width: 100%;
      background-color: #9146FF;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
    }

    #main-app {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .box-container {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      width: 100%;
      max-width: 854px;
    }

    #player-wrapper {
      position: relative;
      width: 854px;
      height: 480px;
      border: 2px solid #29292e;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      background-color: #000;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    .sync-toggle-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #202024;
      border: 1px solid #29292e;
      border-radius: 8px;
      padding: 12px 20px;
      width: 100%;
      max-width: 854px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #3f3f46;
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #00e676;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    #status {
      margin-top: 12px;
      font-size: 0.95rem;
      color: #00e676;
      font-weight: 500;
      text-align: center;
    }

    .ping-badge {
      font-size: 0.8rem;
      color: #a8a8b3;
    }

    #toast-notification {
      display: none;
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(255, 179, 0, 0.95);
      color: #121214;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 2147483647;
      animation: fadeIn 0.3s ease-in-out;
      pointer-events: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

  <h1>Watch Party Sync 🎬</h1>

  <div id="lobby-card">
    <div class="tab-buttons">
      <button id="tab-criar" class="tab-btn active">Criar Sala</button>
      <button id="tab-entrar" class="tab-btn">Entrar em Sala</button>
    </div>

    <div class="input-group">
      <input type="text" id="input-room-id" placeholder="Nome da sala">
      <input type="password" id="input-room-pass" placeholder="Senha da sala">
    </div>

    <button id="btn-criar-sala" class="primary-btn">Criar Nova Sala</button>
    <button id="btn-entrar-sala" class="primary-btn" style="display: none;">Entrar na Sala</button>
  </div>

  <div id="room-status" style="font-size: 0.9rem; color: #a8a8b3; margin-top: 5px;">
    Crie ou entre em uma sala para assistir com amigos.
  </div>

  <div id="main-app">
    <div class="sync-toggle-card">
      <div>
        <strong>⚡ Sync Constante Inteligente</strong>
        <div class="ping-badge" id="ping-display">Latência da Rede: Measuring...</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-sync" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="box-container">
      <input type="text" id="input-video-url" placeholder="Cole o link do vídeo ou live do YouTube...">
      <button id="btn-carregar" class="primary-btn" style="width: auto; padding: 12px 24px;">Carregar Vídeo</button>
    </div>

    <div id="player-wrapper">
      <div id="player"></div>
      <div id="toast-notification">⚠️ Sync Desativado</div>
    </div>

    <div id="status">Status: Aguardando vídeo...</div>
  </div>

  <script src="app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
